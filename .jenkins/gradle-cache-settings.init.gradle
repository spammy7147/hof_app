beforeSettings { settings ->
    settings.caches {
        cleanup = Cleanup.ALWAYS
        releasedWrappers.removeUnusedEntriesAfterDays = 14
        snapshotWrappers.removeUnusedEntriesAfterDays = 3
        downloadedResources.removeUnusedEntriesAfterDays = 14
        createdResources.removeUnusedEntriesAfterDays = 3
        buildCache.removeUnusedEntriesAfterDays = 3
    }
}
